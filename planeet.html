<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creative Automation — Planeet</title>
<meta name="description" content="Scroll en laat de planeet draaien: ontdek wat je leert in Creative Automation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F0E8;
    --paper-2: #E9E5DA;
    --ink: #121212;
    --ink-soft: #55524B;
    --lime: #D4F25A;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --gutter: clamp(16px, 3vw, 40px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: auto; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--display); -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  em { font-family: var(--serif); font-style: italic; font-weight: 400; }
  canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; z-index: 0; }
  #track { position: relative; z-index: 1; pointer-events: none; }

  /* Top bar */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 16px var(--gutter);
    font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .05em;
  }
  .top .brand { background: var(--ink); color: var(--paper); border-radius: 99px; padding: 8px 14px; white-space: nowrap; text-decoration: none; }
  .top nav { display: flex; gap: 8px; }
  .top nav a { color: var(--ink); text-decoration: none; background: var(--paper); border: 1px solid var(--ink); border-radius: 99px; padding: 8px 14px; white-space: nowrap; }
  .top nav a:hover { background: var(--ink); color: var(--paper); }
  @media (max-width: 600px) { .top .brand { display: none; } }

  /* Progress rail */
  .rail {
    position: fixed; z-index: 10; left: var(--gutter); top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px; list-style: none;
    transition: opacity .4s;
  }
  .rail button {
    border: 0; background: none; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 10px;
    font: 500 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft);
    padding: 4px 0;
  }
  .rail button i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--c); transition: background .3s, transform .3s; }
  .rail button span { opacity: 0; transform: translateX(-6px); transition: opacity .3s, transform .3s; white-space: nowrap; }
  .rail:hover button span, .rail button.active span { opacity: 1; transform: none; }
  .rail button.active { color: var(--ink); }
  .rail button.active i { background: var(--c); transform: scale(1.3); }
  @media (max-width: 760px) {
    .rail { left: auto; right: 12px; top: 72px; transform: none; flex-direction: row; gap: 2px; }
    .rail button span { display: none; }
  }

  /* Hero */
  .hero {
    position: fixed; z-index: 5; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 var(--gutter) clamp(28px, 6vh, 64px);
    pointer-events: none;
  }
  .hero .label { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
  .hero h1 { margin-top: 12px; font-size: clamp(56px, 12vw, 190px); line-height: .84; letter-spacing: -.055em; font-weight: 800; }
  .hero h1 em { letter-spacing: -.02em; }
  .hero-row { margin-top: 22px; display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; }
  .hero p { max-width: 34ch; font-size: 19px; line-height: 1.45; color: var(--ink-soft); }
  .scrollcue {
    font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .06em;
    display: inline-flex; gap: 10px; align-items: center;
    background: var(--ink); color: var(--paper); border-radius: 99px; padding: 10px 16px;
  }
  .scrollcue b { display: inline-block; animation: bob 1.4s ease-in-out infinite; color: var(--lime); font-weight: 500; }
  @keyframes bob { 50% { transform: translateY(4px); } }

  /* Cards */
  .card {
    position: fixed; z-index: 5;
    right: var(--gutter); top: 50%;
    width: min(420px, calc(100vw - 32px));
    background: var(--paper); border: 1px solid var(--ink); border-radius: 18px;
    padding: 26px 26px 24px;
    box-shadow: 8px 8px 0 var(--accent);
    opacity: 0; visibility: hidden;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .card .num { font: 500 12px var(--mono); letter-spacing: .06em; display: flex; justify-content: space-between; }
  .card .num span:last-child { color: var(--ink-soft); }
  .card h2 { margin-top: 14px; font-size: 42px; line-height: .98; letter-spacing: -.04em; font-weight: 700; }
  .card h2 em { display: block; color: var(--accent); font-size: 1.05em; }
  .card p { margin-top: 16px; font-size: 16px; line-height: 1.55; color: var(--ink-soft); }
  .card .tags { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card .tags span { font: 400 11px var(--mono); border: 1px solid #12121233; border-radius: 99px; padding: 4px 10px; }
  @media (max-width: 760px) {
    .card {
      top: auto; bottom: max(16px, env(safe-area-inset-bottom)); right: 12px; left: 12px; width: auto;
      padding: 18px 18px 16px; transform: none;
      box-shadow: 5px 5px 0 var(--accent);
      max-height: 46vh; overflow: hidden;
    }
    .card h2 { font-size: 28px; }
    .card p { font-size: 14px; margin-top: 10px; }
    .card .tags { margin-top: 12px; }
  }

  /* Outro */
  .outro {
    position: fixed; z-index: 5; inset: 0;
    display: grid; place-items: center; text-align: center; padding: 24px;
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  .outro > div {
    background: color-mix(in srgb, var(--paper) 82%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 28px; padding: clamp(24px, 4vw, 48px);
  }
  .outro .label { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
  .outro h2 { margin-top: 14px; font-size: clamp(44px, 8vw, 120px); line-height: .9; letter-spacing: -.05em; font-weight: 800; }
  .outro h2 em { color: #3B2BFF; letter-spacing: -.02em; }
  .outro .btns { margin-top: 28px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .outro a {
    text-decoration: none; font: 600 17px var(--display);
    padding: 16px 26px; border-radius: 99px; border: 1px solid var(--ink);
    transition: transform .2s, background .2s, color .2s;
  }
  .outro a.primary { background: var(--ink); color: var(--paper); }
  .outro a.primary:hover { background: var(--lime); color: var(--ink); }
  .outro a.secondary { background: var(--paper); color: var(--ink); }
  .outro a:hover { transform: translateY(-2px); }
  .outro.on { pointer-events: auto; }

  .loading {
    position: fixed; z-index: 20; inset: 0; display: grid; place-items: center;
    background: var(--paper); font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft);
    transition: opacity .6s, visibility .6s;
  }
  .loading.done { opacity: 0; visibility: hidden; }

  @media (prefers-reduced-motion: reduce) { .scrollcue b { animation: none; } }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= Content ================= */
const INTRO = {
  num: '00', title: 'Creative', sub: 'Automation', short: 'Intro', accent: '#3B2BFF',
  text: 'Creative Automation leert je hoe je als digitale vormgever repetitief werk automatiseert en AI inzet als creatieve assistent. Je werkt minder met de hand, produceert meer varianten en houdt toch de controle over het design. Doorheen het semester werk je aan een periodeopdracht: een volledige marketingcampagne voor een product, van briefing tot afgewerkte content.',
  tags: ['Periodeopdracht', 'Marketingcampagne', 'Van briefing tot content']
};
const STATIONS = [
  { num: '01', title: 'Beeldbewerking', sub: 'acties & batch', short: 'Beeld', accent: '#FF5B36',
    text: "Je neemt Photoshop-acties op die een reeks bewerkingen onthouden: resizen, achtergronden uitbreiden met generative fill, een logo plaatsen en exporteren. Met batch-verwerking pas je die actie in één keer toe op een volledige map productfoto's. Zo verwerk je tientallen beelden consistent, zonder ze één voor één te openen.",
    tags: ['Photoshop', 'Acties', 'Generative fill', 'Batch'] },
  { num: '02', title: 'Social media', sub: 'Figma automation', short: 'Social', accent: '#3B2BFF',
    text: 'In Figma Buzz bouw je templates voor verschillende formaten, zoals Instagram-posts, stories en display-banners. Via bulk create vul je die templates automatisch met data uit een CSV- of XLSX-bestand: titels, taglines, call-to-actions en afbeeldingen. Eén spreadsheet levert zo een volledige campagne op in alle formaten, met een consistent design.',
    tags: ['Figma Buzz', 'Templates', 'Bulk create', 'CSV / XLSX'] },
  { num: '03', title: 'Content generatie', sub: 'Weave & Claude Cowork', short: 'Content', accent: '#E0408A',
    text: 'Je genereert beelden en video met AI-tools zoals Weave, en leert hoe je met goede prompts een consistente stijl bewaakt. Met Claude Cowork laat je AI zelfstandig taken uitvoeren op je eigen bestanden: teksten schrijven, documenten opmaken en content plannen. Je ontdekt waar AI je werk versnelt en waar je zelf moet bijsturen.',
    tags: ['Weave', 'Prompting', 'Beeld & video', 'Claude Cowork'] },
  { num: '04', title: 'Vibe coding', sub: '& web', short: 'Web', accent: '#1F8A5B',
    text: 'Met Claude Code bouw je websites en tools door in gewone taal te beschrijven wat je wil. Je breidt Claude uit met skills, en via de Figma MCP-koppeling laat je Claude ontwerpen genereren in Figma en designs omzetten naar HTML en CSS. Je bouwt zelfs je eigen Figma-plugin. Je websites zet je online met GitHub Pages.',
    tags: ['Claude Code', 'Skills', 'Figma MCP', 'Figma-plugin', 'GitHub Pages'] },
  { num: '05', title: 'E-mailmarketing', sub: '& newsletters', short: 'E-mail', accent: '#E8A317',
    text: 'In MailerLite bouw je inschrijvingsformulieren die je op een website plaatst, ontwerp je e-mailcampagnes en zet je automatisatieflows op: een nieuwe inschrijver krijgt bijvoorbeeld automatisch een reeks welkomstmails. Zo leer je hoe merken hun publiek opbouwen en blijven bereiken.',
    tags: ['MailerLite', 'Formulieren', 'Campagnes', 'Automatisatieflows'] },
];
const STOPS = [INTRO, ...STATIONS];       // 6 stops around the planet

const C = {
  paper: '#F3F0E8', paper2: '#E9E5DA', ink: '#121212',
  blue: '#3B2BFF', coral: '#FF5B36', lime: '#D4F25A', pink: '#FFB3D9'
};
const FONT = {
  display: '"Bricolage Grotesque", system-ui, sans-serif',
  serif: '"Instrument Serif", Georgia, serif',
  mono: '"JetBrains Mono", ui-monospace, monospace'
};
const isWide = () => innerWidth > 760;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Scroll timeline ================= */
// u = 0 hero · 1..6 the six stops · 7 outro. Each segment is SEG viewport heights of scroll.
const SEG = 1.6;
const U_MAX = 7;
const track = document.getElementById('track');
const setTrack = () => { track.style.height = `${(U_MAX * SEG + 1) * innerHeight}px`; };
setTrack();
const uFromScroll = () => THREE.MathUtils.clamp(scrollY / (innerHeight * SEG), 0, U_MAX);
const scrollToStop = k => scrollTo({ top: k * innerHeight * SEG + 2, behavior: reduceMotion ? 'auto' : 'smooth' });

/* ================= DOM: cards + rail ================= */
const cardsEl = document.getElementById('cards');
const cards = STOPS.map((st, k) => {
  const el = document.createElement('article');
  el.className = 'card';
  el.style.setProperty('--accent', st.accent);
  const num = document.createElement('div'); num.className = 'num';
  num.innerHTML = `<span>${st.num}${k ? ' / 05' : ''}</span><span>${k ? 'Wat je leert' : 'Welkom'}</span>`;
  const h = document.createElement('h2'); h.append(st.title);
  const em = document.createElement('em'); em.textContent = st.sub; h.append(em);
  const p = document.createElement('p'); p.textContent = st.text;
  const tags = document.createElement('div'); tags.className = 'tags';
  st.tags.forEach(t => { const s = document.createElement('span'); s.textContent = t; tags.append(s); });
  el.append(num, h, p, tags);
  cardsEl.append(el);
  return el;
});
const rail = document.getElementById('rail');
const railBtns = STOPS.map((st, k) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.style.setProperty('--c', st.accent);
  b.innerHTML = `<i></i><span>${st.num} ${st.short}</span>`;
  b.setAttribute('aria-label', `${st.num} ${st.title} ${st.sub}`);
  b.addEventListener('click', () => scrollToStop(k + 1));
  li.append(b); rail.append(li);
  return b;
});

/* ================= Renderer / scene ================= */
const canvas = document.getElementById('world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
const camera = new THREE.PerspectiveCamera(isWide() ? 42 : 64, innerWidth / innerHeight, 0.1, 600);

scene.add(new THREE.HemisphereLight('#ffffff', '#d9d3c4', 1.55));
const sun = new THREE.DirectionalLight('#fff6e8', 2.3);
sun.position.set(24, 70, 34);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -36, right: 36, top: 36, bottom: -36, near: 20, far: 160 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun);

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, metalness: 0, ...extra });
const shadowed = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const solid = m => m;            // (physics only in the game version)
const addSteps = () => {};        // (climbing steps only in the game version)

const CANVAS_REGISTRY = [];
function makeCanvasTex(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  const redraw = (...a) => { draw(ctx, w, h, ...a); tex.needsUpdate = true; };
  redraw();
  CANVAS_REGISTRY.push(redraw);
  return { tex, ctx, redraw };
}
function fitFont(ctx, text, weightFamily, maxSize, maxWidth) {
  let s = maxSize;
  do { ctx.font = weightFamily.replace('{s}', s); s -= 4; } while (ctx.measureText(text).width > maxWidth && s > 20);
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const faceMats = tex => [mat('#fff'), mat('#fff'), mat('#fff'), mat('#fff'), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }), mat('#fff')];

/* ================= Planet ================= */
const R = 26;
const STEP = Math.PI * 2 / STOPS.length;   // 60° between stops
const SIDE = -6.6;                          // pavilions sit left of the path
const AHEAD = .06;                          // …and slightly ahead of the robot

const spin = new THREE.Group();     // slow idle sway in the hero
const planet = new THREE.Group();   // rotation.x = walking angle
spin.add(planet);
scene.add(spin);

{
  const { tex } = makeCanvasTex(512, 256, (ctx, w, h) => {
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#1212121c';
    for (let y = 8; y < h; y += 16) for (let x = 8; x < w; x += 16) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill(); }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 3);
  const globe = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 96), mat('#ffffff', { map: tex }));
  globe.receiveShadow = true;
  planet.add(globe);

  // walking path: a band around the great circle in the YZ plane
  const band = new THREE.Mesh(new THREE.CylinderGeometry(R + .04, R + .04, 2.6, 160, 1, true), mat(C.paper2, { side: THREE.DoubleSide }));
  band.rotation.z = Math.PI / 2;
  band.receiveShadow = true;
  planet.add(band);
  // dashed centre line
  for (let k = 0; k < 120; k++) {
    const a = k / 120 * Math.PI * 2;
    const d = new THREE.Mesh(new THREE.BoxGeometry(.18, .04, .6), mat('#d8d2c3'));
    d.position.set(0, Math.cos(a) * (R + .06), -Math.sin(a) * (R + .06));
    d.rotation.x = -a;
    planet.add(d);
  }
}

// Place an object on the planet surface: angle along the path, sideways offset, local +z turned toward the viewer/path
function placeOnPlanet(obj, angle, side, turn = .3, lift = 0, upright = .7) {
  const pt = new THREE.Vector3(side, Math.cos(angle) * R, -Math.sin(angle) * R);
  const normal = pt.clone().normalize();
  pt.copy(normal).multiplyScalar(R + lift);
  // Stand mostly upright relative to the path instead of leaning outward with the curvature
  const pathUp = new THREE.Vector3(0, Math.cos(angle), -Math.sin(angle));
  const up = normal.clone().lerp(pathUp, upright).normalize();
  const back = new THREE.Vector3(0, Math.sin(angle), Math.cos(angle));      // towards the camera when this angle is on top
  back.sub(up.clone().multiplyScalar(back.dot(up))).normalize();
  const right = new THREE.Vector3().crossVectors(up, back).normalize().negate();
  const z = back.clone().multiplyScalar(Math.cos(turn)).addScaledVector(right, Math.sin(turn)).normalize();
  const x = new THREE.Vector3().crossVectors(up, z).normalize();
  obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, up, z));
  obj.position.copy(pt);
  planet.add(obj);
  return obj;
}

const pavilions = [];   // groups that turn to face the camera

/* ---------- Intro stop: the title board ---------- */
{
  const g = new THREE.Group();
  placeOnPlanet(g, AHEAD, SIDE, 0, -.35);
  pavilions.push(g);
  const base = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(5, 5.3, 2.9, 64), mat('#ffffff')));
  base.position.y = -.55; g.add(base);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(5.1, .14, 8, 96), mat(C.ink));
  rim.rotation.x = Math.PI / 2; rim.position.y = .9; g.add(rim);
  const sign = makeCanvasTex(1600, 900, (ctx, w, h) => {
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = C.ink;
    ctx.font = `500 34px ${FONT.mono}`;
    ctx.fillText('00 — INTRO', 80, 110);
    ctx.textAlign = 'right'; ctx.fillText('SCROLL ↓', w - 80, 110); ctx.textAlign = 'left';
    ctx.font = `800 250px ${FONT.display}`;
    ctx.fillText('Creative', 70, 440);
    ctx.font = `italic 270px ${FONT.serif}`;
    ctx.fillStyle = C.blue;
    ctx.fillText('Automation', 80, 700);
    ctx.fillStyle = C.ink;
    ctx.font = `400 38px ${FONT.display}`;
    ctx.fillText('Vijf onderdelen. Eén campagne. Eén rondje.', 84, 820);
  });
  const W = 7.2, H = 4.05;
  const frame = shadowed(new THREE.Mesh(new THREE.BoxGeometry(W + .24, H + .24, .2), mat(C.ink)));
  frame.position.y = 4;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: sign.tex, toneMapped: false }));
  face.position.z = .11; frame.add(face);
  g.add(frame);
  for (const x of [-2.6, 2.6]) {
    const leg = shadowed(new THREE.Mesh(new THREE.BoxGeometry(.24, 1.4, .24), mat(C.ink)));
    leg.position.set(x, 1.5, 0); g.add(leg);
  }
}

/* ---------- Station pavilions ---------- */
const stations = STATIONS.map((st, i) => {
  const g = new THREE.Group();
  placeOnPlanet(g, (i + 1) * STEP + AHEAD, SIDE, 0, -.35);
  pavilions.push(g);
  const accent = new THREE.Color(st.accent);
  const plat = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(5, 5.3, 2.9, 64), mat('#ffffff')));
  plat.position.y = -.55; g.add(plat);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(5.1, .16, 8, 96), mat(accent));
  rim.rotation.x = Math.PI / 2; rim.position.y = .9; g.add(rim);

  const sign = makeCanvasTex(1024, 1280, (ctx, w, h) => {

    if (v.lengthSq() > 1 || v.lengthSq() < .01) continue;

function play(name, fade = .25, timeScale = 1) {
  const a = robot.actions[name];
  if (!a) return;
  a.timeScale = timeScale;
  if (robot.current === name) return;
  const prev = robot.actions[robot.current];
  a.reset().setEffectiveWeight(1).fadeIn(fade).play();
  if (prev) prev.fadeOut(fade);
  robot.current = name;
}
function playOnce(name, timeScale = 1) {
  if (!robot.actions[name]) return;
  robot.oneShot = name; robot.current = null;
  play(name, .2, timeScale);
}

const robotReady = new Promise(resolve => {
  const urls = [
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
    'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb'
  ];
  const loader = new GLTFLoader();
  const tryLoad = k => {
    if (k >= urls.length) {
      const g = new THREE.Group();
      const torso = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(.35, .6, 6, 16), mat(C.coral)));
      torso.position.y = .95; g.add(torso);
      const head = shadowed(new THREE.Mesh(new THREE.SphereGeometry(.28, 24, 16), mat(C.ink)));
      head.position.y = 1.62; g.add(head);
      robot.group.add(g);
      return resolve();
    }
    loader.load(urls[k], gltf => {
      const model = gltf.scene;
      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model, true);
      model.scale.setScalar(1.75 / (box.max.y - box.min.y));
      model.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true;
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
          if (m.name === 'Main') m.color.set(C.coral);
          if (m.name === 'Grey') m.color.set('#ece8de');
          if (m.name === 'Black') m.color.set(C.ink);
        });
      });
      robot.group.add(model);
      robot.mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(clip => { robot.actions[clip.name] = robot.mixer.clipAction(clip); });
      ['Wave', 'ThumbsUp', 'Yes'].forEach(n => {
        const a = robot.actions[n]; if (!a) return;
        a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true;
      });
      robot.mixer.addEventListener('finished', e => {
        if (robot.oneShot && e.action === robot.actions[robot.oneShot]) robot.oneShot = null;
      });
      play('Idle', 0);
      resolve();
    }, undefined, () => tryLoad(k + 1));
  };
  tryLoad(0);
});

/* ================= Timeline mapping ================= */
const smooth = t => t * t * t * (t * (t * 6 - 15) + 10);
const clamp01 = t => Math.min(1, Math.max(0, t));
// Dwell at each stop for the first 22% of a segment, then travel.
const travel = f => smooth(clamp01((f - .22) / .66));
function angleAt(u) {
  if (u <= 1) return 0;
  const seg = Math.min(Math.floor(u), 6), f = u - seg;
  return (seg - 1) * STEP + STEP * travel(seg === 7 ? 0 : f);
}
function closeness(u) {      // 0 = far planet view, 1 = close follow view
  if (u < 1) return smooth(clamp01((u - .05) / .9));
  if (u > 6) return 1 - smooth(clamp01((u - 6.2) / .75));
  return 1;
}
function cardOpacity(u, k) {   // k = 1..6
  const d = u - k;
  return clamp01(Math.min((d + .3) / .14, (.4 - d) / .14));
}

/* ================= Camera presets ================= */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function camPreset(close) {
  // Look at the midpoint between pavilion and robot, from high up front-right, so the
  // pavilion is seen from above instead of edge-on. The free space next to the info card
  // is handled by the view offset in step(), not by aiming the camera.
  if (close) return isWide()
    ? { pos: V(-1.9, R + 7, 12.6), look: V(-6, R + 1.6, -1.4) }
    : { pos: V(-1.2, R + 8.5, 14), look: V(-4.4, R + 1.4, -1.4) };
  return isWide()
    ? { pos: V(-14, 22, 92), look: V(-11, 3, 0) }
    : { pos: V(0, 30, 150), look: V(0, -14, 0) };
}

/* ================= Loop ================= */
const clock = new THREE.Clock();
let uShown = uFromScroll();
let lastAngle = angleAt(uShown);
let stillTime = 0, wavedAt = -1;
const tmpPos = new THREE.Vector3(), tmpLook = new THREE.Vector3();

let simT = 0;
function step(dt) {
  simT += dt;
  const t = simT;

  // ease towards the scroll position so motion stays buttery even with notchy wheels
  const uTarget = uFromScroll();
  uShown += (uTarget - uShown) * Math.min(1, dt * (reduceMotion ? 30 : 6));
  if (Math.abs(uTarget - uShown) < .0005) uShown = uTarget;
  const u = uShown;

  // planet rotation = the walk
  const angle = angleAt(u);
  planet.rotation.x = angle;
  const close = closeness(u);
  spin.rotation.y = (1 - close) * Math.sin(t * .18) * .5;

  // robot: speed comes only from scrolling
  const dAngle = angle - lastAngle; lastAngle = angle;
  const speed = dAngle / Math.max(dt, 1e-4) * R;                      // surface speed, signed
  const targetFacing = speed < -.3 ? 0 : Math.PI;                      // scrolling back = walking back
  if (Math.abs(speed) > .3) {
    const d = ((targetFacing - robot.facing + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    robot.facing += d * Math.min(1, dt * 8);
  }
  robot.group.rotation.y = robot.facing;
  const s = Math.abs(speed);
  if (robot.oneShot && s > .6) robot.oneShot = null;
  if (!robot.oneShot) {
    if (s < .3) play(u > 6.85 && robot.actions.Dance ? 'Dance' : 'Idle', .35);
    else if (s < 5) play('Walking', .25, THREE.MathUtils.clamp(s / 2.6, .6, 2));
    else play('Running', .25, THREE.MathUtils.clamp(s / 7, .8, 2.2));
  }
  // wave once when you settle at a stop
  stillTime = s < .3 ? stillTime + dt : 0;
  const nearStop = Math.round(u);
  if (stillTime > .35 && nearStop >= 1 && nearStop <= 6 && Math.abs(u - nearStop) < .3 && wavedAt !== nearStop) {
    wavedAt = nearStop;
    robot.facing = Math.PI * .72;     // turn a little towards the pavilion
    playOnce(nearStop === 1 ? 'Wave' : (nearStop % 2 ? 'ThumbsUp' : 'Wave'), 1.1);
  }
  if (Math.abs(u - wavedAt) > .6) wavedAt = -1;
  if (robot.mixer) robot.mixer.update(dt);

  // camera between the far planet view and the close follow view
  const far = camPreset(false), near = camPreset(true);
  // Pull the close camera back when the free area next to the card is narrower than designed for
  const ref = cards[Math.max(0, Math.min(5, Math.round(u) - 1))];
  const freeW = isWide() ? innerWidth - ref.offsetWidth - 40 : innerWidth;
  const freeH = isWide() ? innerHeight : innerHeight - ref.offsetHeight - 16;
  const designAspect = isWide() ? 1.27 : 1.15;
  const pull = THREE.MathUtils.clamp(designAspect / (freeW / freeH), 1, 2.2);
  near.pos.sub(near.look).multiplyScalar(pull).add(near.look);
  tmpPos.lerpVectors(far.pos, near.pos, close);
  tmpLook.lerpVectors(far.look, near.look, close);
  if (!reduceMotion) { tmpPos.x += Math.sin(t * .4) * .35 * close; tmpPos.y += Math.sin(t * .31) * .2; }
  camera.position.copy(tmpPos);
  camera.lookAt(tmpLook);
  // Shift the rendered frame so the subject is centred in the space the info card leaves free
  // (desktop: card on the right → shift left; phone: card at the bottom → shift up).
  const offX = isWide() ? close * (ref.offsetWidth + 40) / 2 : 0;
  const offY = isWide() ? 0 : close * (ref.offsetHeight + 16) / 2;
  camera.setViewOffset(innerWidth, innerHeight, offX, offY, innerWidth, innerHeight);

  moons.forEach(o => {
    const a = t * o.s + o.o;
    o.m.position.set(Math.cos(a) * o.r, Math.sin(a) * o.r * Math.sin(o.tilt), Math.sin(a) * o.r * Math.cos(o.tilt));
    o.m.rotation.set(t * .3, t * .2, 0);
  });
  stations.forEach(st => st.update(t));
  // turn each pavilion around its own up axis so it faces the camera
  pavilions.forEach(g => {
    g.updateWorldMatrix(true, false);
    const local = g.worldToLocal(camera.position.clone());
    const target = Math.atan2(local.x, local.z);
    const pv = g.userData.pivot;
    const d = ((target - pv.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    pv.rotation.y += d * Math.min(1, dt * 4);
  });

  // overlays
  const heroO = 1 - clamp01(u / .45);
  const hero = document.getElementById('hero');
  hero.style.opacity = heroO;
  hero.style.transform = `translateY(${(1 - heroO) * -30}px)`;
  hero.style.visibility = heroO > 0 ? 'visible' : 'hidden';
  let active = -1;
  cards.forEach((c, i) => {
    const o = cardOpacity(u, i + 1);
    if (o > .5) active = i;
    c.style.opacity = o;
    c.style.visibility = o > 0 ? 'visible' : 'hidden';
    const shift = (1 - o) * 24 * Math.sign(u - (i + 1) - .05 || 1);
    c.style.transform = isWide() ? `translateY(calc(-50% - ${shift}px))` : `translateY(${-shift}px)`;
  });
  railBtns.forEach((b, i) => b.classList.toggle('active', i === active));
  const outO = clamp01((u - 6.6) / .3);
  const outro = document.getElementById('outro');
  outro.style.opacity = outO;
  outro.style.visibility = outO > 0 ? 'visible' : 'hidden';
  outro.classList.toggle('on', outO > .5);
  document.getElementById('rail').style.opacity = u < .6 ? clamp01(u / .6) : (u > 6.7 ? 1 - clamp01((u - 6.7) / .2) : 1);

  renderer.render(scene, camera);
}
function tick() {
  step(Math.min(clock.getDelta(), .05));
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = isWide() ? 42 : 64;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
  setTrack();
});
addEventListener('keydown', e => {
  const cur = Math.round(uFromScroll());
  if (['ArrowDown', 'PageDown', ' '].includes(e.key) && !e.shiftKey) { e.preventDefault(); scrollToStop(Math.min(U_MAX, cur + 1)); }
  if (['ArrowUp', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); scrollToStop(Math.max(0, cur - 1)); }
});

async function fontsReady() {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`800 100px ${FONT.display}`),
        document.fonts.load(`700 100px ${FONT.display}`),
        document.fonts.load(`600 100px ${FONT.display}`),
        document.fonts.load(`italic 100px ${FONT.serif}`),
        document.fonts.load(`500 30px ${FONT.mono}`),
        document.fonts.load(`400 30px ${FONT.mono}`),
      ]),
      new Promise(r => setTimeout(r, 3000))
    ]);
  } catch (e) {}
}
Promise.all([fontsReady(), robotReady]).then(() => {
  CANVAS_REGISTRY.forEach(fn => fn());
  document.getElementById('loading').classList.add('done');
});
tick();
</script>
</body>
</html>
